name: ParisCompanion
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

targets:
  ParisCompanion:
    type: application
    platform: iOS
    sources:
      - path: ParisCompanion
        excludes:
          - "Info.plist"
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ParisCompanion
        INFOPLIST_FILE: ParisCompanion/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
